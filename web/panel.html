<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Porra 2026">
<title>Porra Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PORRA MUNDIAL 2026 — Panel SPA · prensa deportiva retro
   ============================================================ */
:root{
  --paper:#F3EEDF; --paper-dark:#E8E1CB; --ink:#141210; --ink-soft:#4A433A;
  --red:#C8202E; --red-deep:#9C1722; --yellow:#F5C518;
  --gold:#C8961C; --gold-light:#E8B83A; --silver:#9AA0A6; --silver-light:#C8CDD2;
  --bronze:#9F5A2A; --bronze-light:#C07A3F; --up:#1F7A3A; --down:#B11824;
  --neon:#2EE83C;
  --ff-d:'Oswald',sans-serif; --ff-b:'IBM Plex Sans',system-ui,sans-serif;
  --ff-m:'IBM Plex Mono',ui-monospace,monospace; --ff-s:'IBM Plex Serif',serif;
  --topbar-h:128px; --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--ff-b); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.3;
  max-width:560px; margin:0 auto; min-height:100vh; position:relative;
  border-left:2px solid var(--ink); border-right:2px solid var(--ink);
}
/* halftone overlay global */
body::before{
  content:""; position:fixed; inset:0; max-width:560px; margin:0 auto; pointer-events:none; z-index:1;
  background-image:radial-gradient(rgba(20,18,16,0.04) 1px, transparent 1.4px);
  background-size:3px 3px;
}
.mono{font-family:var(--ff-m);text-transform:uppercase;letter-spacing:.2em;}
.tnum{font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;}

/* ---------- ISO crest (escudo) ---------- */
.crest{position:relative;background:var(--paper-dark);border:2px solid var(--ink);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.crest .stripes{position:absolute;inset:3px;display:flex;flex-direction:column;opacity:.22;}
.crest .stripes>div{flex:1;}
.crest .stripes>div:nth-child(1){background:var(--ink);}
.crest .stripes>div:nth-child(3){background:var(--ink);}
.crest .iso{position:relative;z-index:1;font-family:var(--ff-d);font-weight:700;color:var(--ink);letter-spacing:.01em;line-height:1;}
.crest.ph{background:repeating-linear-gradient(45deg,var(--paper-dark) 0 6px,transparent 6px 12px);}
.crest.ph .iso{color:var(--ink-soft);font-family:var(--ff-m);font-weight:600;}

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar{position:fixed;top:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:20;
  background:var(--paper);border-bottom:3px solid var(--ink);}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:2px;background:var(--ink);}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--ink);color:var(--paper);padding:7px 14px;}
.masthead__brand{display:flex;align-items:center;gap:10px;min-width:0;}
.logo-slot{position:relative;width:40px;height:40px;flex-shrink:0;display:block;background:var(--paper);border-radius:3px;}
.logo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;padding:3px;}
.logo-img.ready{display:block;}
.logo-img.ready + .emblem-fallback{display:none;}
.emblem-fallback{position:absolute;inset:0;width:100%;height:100%;}
.masthead__title{font-family:var(--ff-d);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.masthead__title b{color:var(--yellow);}
.masthead__upd{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.16em;color:rgba(243,238,223,.62);text-transform:uppercase;text-align:right;line-height:1.25;white-space:nowrap;flex-shrink:0;}
.nextbar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--paper);min-height:62px;}
.nextbar__lab{font-family:var(--ff-m);font-size:10px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(200,32,46,.6);animation:livepulse 1.2s ease-in-out infinite;flex-shrink:0;}
@keyframes livepulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(200,32,46,.55);}50%{opacity:.45;box-shadow:0 0 0 6px rgba(200,32,46,0);}}
.nextbar__teams{display:flex;align-items:center;gap:7px;flex:1;min-width:0;}
.nextbar__teams .crest{width:30px;height:30px;}
.nextbar__teams .crest .iso{font-size:13px;}
.nextbar__vs{font-family:var(--ff-d);font-weight:600;font-size:13px;color:var(--ink-soft);}
.nextbar__meta{font-family:var(--ff-m);font-size:10px;letter-spacing:.08em;color:var(--ink-soft);text-align:right;text-transform:uppercase;line-height:1.3;flex-shrink:0;}
.nextbar__meta b{display:block;font-size:11px;color:var(--ink);letter-spacing:.1em;}

/* ============================================================
   LAYOUT / SCROLL
   ============================================================ */
.screen{display:none;padding:16px 16px 24px;position:relative;z-index:2;}
.screen.active{display:block;}
main{padding-top:var(--topbar-h);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));min-height:100vh;}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid var(--ink);padding-bottom:8px;margin:4px 0 16px;gap:12px;}
.sec-head h2{font-family:var(--ff-d);font-weight:700;font-size:30px;letter-spacing:.04em;text-transform:uppercase;line-height:1;}
.sec-head .meta{font-family:var(--ff-m);font-size:10px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;text-align:right;line-height:1.3;}

/* ============================================================
   PODIO
   ============================================================ */
.podium{display:grid;grid-template-columns:1fr 1.16fr 1fr;gap:8px;align-items:end;margin-bottom:6px;}
.pod{border:2px solid var(--ink);background:var(--paper);padding:14px 8px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;cursor:pointer;}
.pod::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(20,18,16,0.06) 0.9px,transparent 1.3px);background-size:5px 5px;opacity:.5;}
.pod>*{position:relative;z-index:1;}
.pod--2{padding-top:18px;}
.pod--3{padding-top:24px;}
.pod--1{background:var(--paper-dark);padding-top:30px;box-shadow:4px 4px 0 0 var(--ink);}
.pod--1::before{content:"★ CAMPEÓN ★";position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--paper);font-family:var(--ff-d);font-weight:700;font-size:12px;letter-spacing:.18em;padding:4px 12px 3px;white-space:nowrap;z-index:2;}
.medal{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-weight:700;font-size:32px;color:var(--ink);border:2.5px solid var(--ink);position:relative;}
.pod--1 .medal{width:70px;height:70px;font-size:40px;background:radial-gradient(circle at 32% 28%,#FFE08A 0%,var(--gold-light) 42%,var(--gold) 100%);}
.pod--2 .medal{background:radial-gradient(circle at 32% 28%,#EDEFF2 0%,var(--silver-light) 42%,var(--silver) 100%);}
.pod--3 .medal{background:radial-gradient(circle at 32% 28%,#E8B894 0%,var(--bronze-light) 42%,var(--bronze) 100%);}
.medal::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px dashed rgba(20,18,16,.45);}
.pod__name{margin-top:10px;font-family:var(--ff-d);font-weight:700;font-size:17px;line-height:1.02;text-transform:uppercase;text-wrap:balance;}
.pod--1 .pod__name{font-size:20px;}
.pod__pts{margin-top:8px;font-family:var(--ff-d);font-weight:700;font-size:38px;line-height:.9;}
.pod--1 .pod__pts{font-size:50px;color:var(--red-deep);}
.pod__ptslab{font-family:var(--ff-m);font-size:9px;letter-spacing:.2em;color:var(--ink-soft);text-transform:uppercase;}

/* ============================================================
   TABLA CLASIFICACIÓN
   ============================================================ */
.tbl{border:2px solid var(--ink);margin-top:18px;}
.tbl__head{display:grid;grid-template-columns:42px 1fr 56px;align-items:center;gap:10px;
  padding:9px 14px;background:var(--ink);color:var(--paper);
  font-family:var(--ff-m);font-size:10px;letter-spacing:.2em;text-transform:uppercase;}
.tbl__head .r{text-align:right;}
.lbrow{display:grid;grid-template-columns:42px 1fr 56px;align-items:center;gap:10px;
  padding:11px 14px;border-bottom:1px solid rgba(20,18,16,.13);width:100%;text-align:left;background:transparent;}
.lbrow:last-child{border-bottom:none;}
.lbrow:nth-child(even){background:rgba(20,18,16,.045);}
.lbrow:active{background:var(--yellow);}
.lbrow__pos{font-family:var(--ff-d);font-weight:600;font-size:20px;}
.lbrow__name{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;min-width:0;}
.lbrow__name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lbrow__pts{font-family:var(--ff-d);font-weight:700;font-size:22px;text-align:right;}
.tag-clava{font-size:13px;line-height:1;flex-shrink:0;}
.tlink{color:inherit;text-decoration:underline;text-decoration-color:rgba(20,18,16,.3);text-underline-offset:2px;}

/* mini ranking quién clava */
.panel{border:2px solid var(--ink);margin-top:18px;background:var(--paper-dark);position:relative;}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(20,18,16,0.06) .9px,transparent 1.3px);background-size:5px 5px;opacity:.5;}
.panel>*{position:relative;z-index:1;}
.panel__h{font-family:var(--ff-d);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:8px;}
.clava-list{display:flex;flex-direction:column;}
.clava-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 14px;border-bottom:1px solid rgba(20,18,16,.12);font-size:14px;align-items:center;}
.clava-row:last-child{border-bottom:none;}
.clava-row b{font-family:var(--ff-d);font-weight:700;font-size:18px;}
.bar{height:9px;background:var(--paper);border:1px solid var(--ink);position:relative;margin-top:3px;}
.bar>span{position:absolute;left:0;top:0;bottom:0;background:var(--red);}

/* H2H button */
.btn-block{display:flex;gap:8px;margin-top:16px;}
.btn{flex:1;border:2px solid var(--ink);background:var(--paper);padding:12px;font-family:var(--ff-d);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{background:var(--yellow);}
.btn--ink{background:var(--ink);color:var(--paper);}

/* ============================================================
   GRUPOS
   ============================================================ */
.grp{border:2px solid var(--ink);margin-bottom:16px;background:var(--paper);}
.grp__h{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:8px 14px;}
.grp__badge{font-family:var(--ff-d);font-weight:700;font-size:18px;background:var(--yellow);color:var(--ink);width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
.grp__h .t{font-family:var(--ff-d);font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;}
.gst__head,.gst__row{display:grid;grid-template-columns:24px 1fr 30px 52px 34px 34px;align-items:center;gap:6px;padding:7px 12px;font-size:13px;}
.gst__head{font-family:var(--ff-m);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1.5px solid var(--ink);}
.gst__head .r,.gst__row .r{text-align:right;}
.gst__row{border-bottom:1px solid rgba(20,18,16,.12);}
.gst__row:last-of-type{border-bottom:none;}
.gst__row .pos{font-family:var(--ff-d);font-weight:600;font-size:15px;}
.gst__row .tm{display:flex;align-items:center;gap:7px;min-width:0;}
.gst__row .tm .crest{width:22px;height:22px;}
.gst__row .tm .crest .iso{font-size:10px;}
.gst__row .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.gst__row .pts{font-family:var(--ff-d);font-weight:700;font-size:16px;text-align:right;}
.gst__row.q1{background:rgba(31,122,58,.10);}
.gst__row.q1 .pos{color:var(--up);}
.gst__row.q3{background:rgba(245,197,24,.16);}
.gst__empty{padding:16px 14px;font-family:var(--ff-m);font-size:10px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;text-align:center;}
.grp__matches{border-top:2px solid var(--ink);}
.mday{font-family:var(--ff-m);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);padding:8px 14px 4px;}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid rgba(20,18,16,.12);width:100%;background:transparent;text-align:left;}
.mrow:last-child{border-bottom:none;}
.mrow:active{background:var(--yellow);}
.mrow .side{display:flex;align-items:center;gap:7px;min-width:0;}
.mrow .side.away{flex-direction:row-reverse;text-align:right;}
.mrow .side .crest{width:24px;height:24px;}
.mrow .side .crest .iso{font-size:11px;}
.mrow .side span{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrow .mid{text-align:center;min-width:54px;}
.mrow .score{font-family:var(--ff-d);font-weight:700;font-size:20px;line-height:1;}
.mrow .ko{font-family:var(--ff-m);font-size:10px;letter-spacing:.06em;color:var(--ink-soft);line-height:1.25;text-transform:uppercase;}
.mrow .live{display:inline-flex;align-items:center;gap:4px;font-family:var(--ff-m);font-size:9px;letter-spacing:.1em;color:var(--red);font-weight:600;}

/* ============================================================
   BRACKET
   ============================================================ */
.bracket-outer{position:relative;margin:0 -16px;}
.bracket-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 4px;scrollbar-width:none;-ms-overflow-style:none;}
.bracket-wrap::-webkit-scrollbar{display:none;width:0;height:0;}
/* desvanecidos en los bordes para insinuar el scroll */
.bracket-outer::before,.bracket-outer::after{content:"";position:absolute;top:0;bottom:14px;width:26px;pointer-events:none;z-index:3;opacity:0;transition:opacity .2s;}
.bracket-outer::before{left:0;background:linear-gradient(to right,var(--paper),transparent);}
.bracket-outer::after{right:0;background:linear-gradient(to left,var(--paper),transparent);}
.bracket-outer.can-left::before{opacity:1;}
.bracket-outer.can-right::after{opacity:1;}
.bracket{display:flex;gap:14px;min-width:max-content;}
.bround{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:178px;}
.bround__h{font-family:var(--ff-m);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding-bottom:4px;border-bottom:1.5px solid var(--ink);margin-bottom:4px;position:sticky;top:0;}
/* barra de progreso de scroll a medida (sustituye a la nativa) */
.brk-track{position:relative;height:6px;background:var(--paper-dark);border:1.5px solid var(--ink);margin:10px 0 2px;}
.brk-thumb{position:absolute;top:-1.5px;bottom:-1.5px;left:0;width:40%;background:var(--red);border:1.5px solid var(--ink);min-width:32px;transition:left .05s linear;}
.brk-hint{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-family:var(--ff-m);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px;}
.brk-hint .ar{animation:nudge 1.4s ease-in-out infinite;display:inline-block;}
@keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(4px);}}
.bmatch{border:2px solid var(--ink);background:var(--paper);width:178px;}
.bmatch.resolved{cursor:pointer;}
.bmatch.resolved:active{background:var(--yellow);}
.bteam{display:grid;grid-template-columns:26px 1fr 22px;align-items:center;gap:6px;padding:7px 8px;font-size:12px;}
.bteam+.bteam{border-top:1px solid rgba(20,18,16,.18);}
.bteam .crest{width:22px;height:22px;}
.bteam .crest .iso{font-size:9px;}
.bteam .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bteam .sc{font-family:var(--ff-d);font-weight:700;font-size:15px;text-align:right;}
.bteam.seed{opacity:.5;}
.bteam.seed .nm{font-family:var(--ff-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
.bteam.win{background:rgba(31,122,58,.10);}
.bfinal{border-color:var(--red);border-width:3px;}

/* ============================================================
   DESCARGAS
   ============================================================ */
.lede{font-family:var(--ff-s);font-style:italic;font-size:19px;line-height:1.45;border-left:4px solid var(--red);padding:4px 0 4px 16px;margin-bottom:8px;}
.dl{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);padding:14px;margin-top:12px;background:var(--paper);text-decoration:none;color:inherit;}
.dl:active{background:var(--yellow);}
.dl.disabled{opacity:.42;pointer-events:none;}
.dl__ic{width:40px;height:40px;flex-shrink:0;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-weight:700;font-size:13px;background:var(--paper-dark);}
.dl__ic.xls{background:rgba(31,122,58,.16);}
.dl__t{flex:1;min-width:0;}
.dl__t b{display:block;font-family:var(--ff-d);font-weight:600;font-size:16px;letter-spacing:.02em;text-transform:uppercase;}
.dl__t small{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase;}
.dl__arrow{font-family:var(--ff-d);font-weight:700;font-size:20px;color:var(--ink-soft);}
.subhd{font-family:var(--ff-d);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--ink);}
.audit-stamp{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper-dark);border:1.5px solid var(--ink);padding:8px 12px;margin-top:10px;}
.audit-stamp .mono{font-size:9.5px;letter-spacing:.16em;color:var(--ink-soft);}
.audit-stamp b{font-family:var(--ff-d);font-weight:700;font-size:15px;letter-spacing:.04em;white-space:nowrap;}

/* ============================================================
   NAV INFERIOR
   ============================================================ */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:20;
  display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);
  border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);}
.nav__b{padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(243,238,223,.6);position:relative;}
.nav__b svg{width:22px;height:22px;}
.nav__b span{font-family:var(--ff-m);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;}
.nav__b.active{color:var(--yellow);}
.nav__b.active::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--yellow);}

/* ============================================================
   MODAL / SHEET
   ============================================================ */
.sheet-bg{position:fixed;inset:0;max-width:560px;margin:0 auto;background:rgba(20,18,16,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:41;
  background:var(--paper);border-top:3px solid var(--ink);max-height:92vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.7,.2,1);}
.sheet.open{transform:translateY(0);}
.sheet::before{content:"";position:fixed;left:0;right:0;max-width:560px;margin:0 auto;pointer-events:none;}
.sheet__grab{position:sticky;top:0;background:var(--paper);z-index:3;padding:10px 0 6px;display:flex;justify-content:center;border-bottom:2px solid var(--ink);}
.sheet__grab i{width:46px;height:5px;background:var(--ink-soft);display:block;}
.sheet__close{position:absolute;top:8px;right:12px;width:34px;height:34px;border:2px solid var(--ink);background:var(--paper);font-family:var(--ff-d);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:4;}
.sheet__body{padding:18px 16px 32px;}

.pf-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px;}
.pf-head .medal{width:54px;height:54px;font-size:26px;border-radius:50%;background:var(--paper-dark);flex-shrink:0;}
.pf-head__name{font-family:var(--ff-d);font-weight:700;font-size:26px;line-height:1;text-transform:uppercase;}
.pf-head__sub{font-family:var(--ff-m);font-size:10px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase;margin-top:5px;}
.pf-head__pts{margin-left:auto;text-align:right;}
.pf-head__pts b{font-family:var(--ff-d);font-weight:700;font-size:40px;line-height:.85;color:var(--red-deep);display:block;}
.pf-head__pts small{font-family:var(--ff-m);font-size:9px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;}

.blk{margin-top:20px;}
.blk__h{font-family:var(--ff-d);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding-bottom:6px;border-bottom:1.5px solid var(--ink);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
details.blk>summary{cursor:pointer;list-style:none;}
details.blk>summary::-webkit-details-marker{display:none;}
details.blk>summary::after{content:"▾";color:var(--ink-soft);font-size:12px;margin-left:8px;}
details.blk:not([open])>summary::after{content:"▸";}
.catbar{margin-bottom:9px;}
.catbar__top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.catbar__top .l{font-weight:500;}
.catbar__top .v{font-family:var(--ff-d);font-weight:700;}
.honor{display:grid;grid-template-columns:1fr;gap:8px;}
.honor__row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);padding:9px 12px;font-size:14px;}
.honor__row .k{font-family:var(--ff-m);font-size:9px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;width:78px;flex-shrink:0;}
.honor__row .pick{font-weight:600;flex:1;}
.honor__row .ck{font-family:var(--ff-d);font-weight:700;font-size:15px;}
.ck.ok{color:var(--up);} .ck.no{color:var(--down);} .ck.pend{color:var(--ink-soft);}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.statbox{border:2px solid var(--ink);text-align:center;padding:12px;background:var(--paper-dark);}
.statbox b{font-family:var(--ff-d);font-weight:700;font-size:34px;line-height:.9;display:block;}
.statbox small{font-family:var(--ff-m);font-size:9px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
.hist__row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(20,18,16,.12);font-size:13px;}
.hist__row:last-child{border-bottom:none;}
.hist__ic{font-size:15px;width:22px;text-align:center;flex-shrink:0;}
.hist__tx{flex:1;min-width:0;}
.hist__tx b{font-weight:600;}
.hist__tx .det{color:var(--ink-soft);font-size:12px;}
.hist__pts{font-family:var(--ff-d);font-weight:700;font-size:16px;}
.pick-mini{font-family:var(--ff-m);font-weight:600;font-size:11px;letter-spacing:.04em;background:var(--paper-dark);border:1px solid var(--ink);padding:1px 6px;}

/* match sheet */
.ms-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:8px;}
.ms-head .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.ms-head .side .crest{width:62px;height:62px;}
.ms-head .side .crest .iso{font-size:24px;}
.ms-head .side .nm{font-family:var(--ff-d);font-weight:700;font-size:16px;text-transform:uppercase;line-height:1;text-wrap:balance;}
.ms-head .mid{text-align:center;}
.ms-head .mid .sc{font-family:var(--ff-d);font-weight:700;font-size:46px;line-height:.9;}
.ms-head .mid .ko{font-family:var(--ff-d);font-weight:700;font-size:18px;}
.ms-head .mid .st{font-family:var(--ff-m);font-size:9px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:5px;}
.ms-tv{text-align:center;font-family:var(--ff-m);font-size:10px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;}
.consenso{display:flex;height:34px;border:2px solid var(--ink);margin:14px 0 4px;overflow:hidden;}
.consenso>div{display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-weight:700;font-size:13px;color:var(--paper);min-width:0;}
.consenso .ch{background:var(--red);} .consenso .cd{background:var(--ink-soft);} .consenso .ca{background:var(--ink);}
.consenso__lab{display:flex;justify-content:space-between;font-family:var(--ff-m);font-size:9px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:14px;}
.porra-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(20,18,16,.12);font-size:14px;}
.porra-row:last-child{border-bottom:none;}
.porra-row .who{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0;}
.porra-row .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge-clava{font-family:var(--ff-m);font-size:9px;font-weight:600;letter-spacing:.04em;color:var(--ink-soft);flex-shrink:0;}
.porra-row .pk{font-family:var(--ff-m);font-weight:600;font-size:12px;background:var(--paper-dark);border:1px solid var(--ink);padding:2px 7px;}
.porra-row .rs{font-size:16px;width:24px;text-align:center;}
.porra-row .pp{font-family:var(--ff-d);font-weight:700;font-size:15px;width:30px;text-align:right;}
/* eliminatorias: sello ×N, quién acierta el país que pasa, mi cuadro */
.bteam .bx{font-family:var(--ff-m);font-size:8px;font-weight:700;color:var(--ink-soft);margin-left:3px;}
.ko-quien{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ko-quien__t{font-family:var(--ff-m);font-size:11px;font-weight:700;letter-spacing:.04em;margin-bottom:6px;}
.ko-quien__t .mono{color:var(--ink-soft);font-size:10px;}
.chip{display:inline-block;font-family:var(--ff-m);font-size:11px;background:var(--paper-dark);border:1px solid var(--ink);padding:1px 6px;margin:0 3px 3px 0;}
.empty-mini{font-size:11px;color:var(--ink-soft);}
.ko-round__h{font-family:var(--ff-m);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:8px 0 4px;}
.ko-pick{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(20,18,16,.1);font-size:13px;}
.ko-pick .mk{font-family:var(--ff-m);font-weight:700;background:var(--paper-dark);border:1px solid var(--ink);padding:1px 7px;}

/* H2H */
.h2h-grid{display:grid;grid-template-columns:1fr 56px 1fr;gap:6px;align-items:center;margin-top:4px;}
.h2h-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.h2h-sel select{font-family:var(--ff-d);font-weight:600;font-size:15px;text-transform:uppercase;border:2px solid var(--ink);background:var(--paper);padding:10px;width:100%;-webkit-appearance:none;appearance:none;text-align:center;}
.h2h-cat{font-family:var(--ff-m);font-size:9px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;text-align:center;}
.h2h-v{font-family:var(--ff-d);font-weight:700;font-size:20px;text-align:center;padding:6px 0;border-bottom:1px solid rgba(20,18,16,.14);}
.h2h-v.win{color:var(--up);}
.h2h-name{font-family:var(--ff-d);font-weight:700;font-size:16px;text-transform:uppercase;text-align:center;}

.empty{padding:30px 16px;text-align:center;font-family:var(--ff-m);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;border:2px dashed rgba(20,18,16,.3);}

/* ============================================================
   CUADRO FINAL RADIAL por jugador (feature "Ver mi cuadro")
   ============================================================ */
.btn-bracket{display:inline-flex;align-items:center;gap:9px;margin-top:10px;
  background:var(--ink);color:var(--paper);border:2px solid var(--ink);
  padding:9px 14px 8px;font-family:var(--ff-d);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:3px 3px 0 0 var(--gold);transition:transform .08s,box-shadow .08s;}
.btn-bracket:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 0 var(--gold);}
.btn-bracket:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 var(--gold);background:var(--red-deep);}
.btn-bracket .rad{width:20px;height:20px;flex-shrink:0;}
.btn-bracket .rad circle{fill:none;stroke:var(--yellow);stroke-width:2;}
.btn-bracket .rad line{stroke:var(--yellow);stroke-width:2;}

/* hoja casi a pantalla completa (encima de la ficha) */
#bracket-bg{z-index:42;}
#bracket{z-index:43;max-height:96vh;height:96vh;display:flex;flex-direction:column;overflow:hidden;}
.bk-topbar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:2px solid var(--ink);background:var(--ink);flex-shrink:0;}
.bk-switch{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--paper);box-shadow:3px 3px 0 0 var(--gold);padding:6px 10px;position:relative;cursor:pointer;}
.bk-switch__lab{font-family:var(--ff-m);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);flex-shrink:0;}
.bk-switch select{flex:1;min-width:0;-webkit-appearance:none;appearance:none;border:none;background:transparent;
  font-family:var(--ff-d);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);cursor:pointer;padding-right:4px;}
.bk-switch select:focus{outline:none;}
.bk-switch__chev{font-family:var(--ff-d);font-weight:700;color:var(--red);font-size:16px;flex-shrink:0;}
.bk-toggle{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;border:2px solid var(--paper);background:transparent;color:var(--paper);padding:7px 11px;font-family:var(--ff-d);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;}
.bk-toggle svg{width:16px;height:16px;}
.bk-toggle[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow);}
.bk-head{padding:14px 16px 12px;border-bottom:2px solid var(--ink);display:flex;align-items:flex-start;gap:12px;flex-shrink:0;}
.bk-head__t{flex:1;min-width:0;}
.bk-kick{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.2em;color:var(--red);text-transform:uppercase;}
.bk-title{font-family:var(--ff-d);font-weight:700;font-size:22px;line-height:1;text-transform:uppercase;margin-top:3px;}
.bk-sub{font-family:var(--ff-m);font-size:10px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase;margin-top:4px;}
.bk-close{width:36px;height:36px;border:2px solid var(--ink);background:var(--paper);font-family:var(--ff-d);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bk-legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px 16px;border-bottom:1.5px solid rgba(20,18,16,.18);font-family:var(--ff-m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);flex-shrink:0;align-items:center;}
.lg{display:inline-flex;align-items:center;gap:6px;}
.lg i{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:50%;display:inline-block;}
.lg i.hit{background:#F7EFD2;box-shadow:0 0 0 1.5px var(--gold);}
.lg i.cruce{background:#E9F9E4;box-shadow:0 0 0 1.5px var(--neon);}
.bfit{position:relative;flex:1;min-height:48vh;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,rgba(245,197,24,.16),rgba(245,197,24,0) 46%),var(--paper);
  touch-action:none;cursor:grab;}
.bfit:active{cursor:grabbing;}
.bfit::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(20,18,16,.05) 1px,transparent 1.3px);background-size:4px 4px;opacity:.6;}
.bzoom{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
.bstage{position:relative;width:600px;height:600px;}
.blines{position:absolute;inset:0;width:600px;height:600px;transition:opacity .5s ease;}
.bstage.settling .blines{opacity:0;}
.blines line{stroke:var(--ink-soft);stroke-width:1.4;opacity:.42;}
.blines line.lit{stroke:var(--gold);stroke-width:2.4;opacity:.95;}
.blines line.dim{stroke:var(--ink-soft);opacity:.16;}
.blines line.cruce{stroke:var(--neon);stroke-width:2.8;opacity:1;}
.blines circle.guide{fill:none;stroke:var(--ink-soft);stroke-width:1;opacity:.10;stroke-dasharray:2 5;}
.bnode{position:absolute;transform:translate(-50%,-50%);}
.rchip{position:relative;width:100%;height:100%;border-radius:50%;border:2px solid var(--ink);background:var(--paper-dark);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.rstripes{position:absolute;inset:2px;border-radius:50%;display:flex;flex-direction:column;opacity:.2;overflow:hidden;}
.rstripes i{flex:1;}
.rstripes i:nth-child(1),.rstripes i:nth-child(3){background:var(--ink);}
.riso{position:relative;z-index:1;font-family:var(--ff-d);font-weight:700;line-height:1;color:var(--ink);}
.bnode.hit .rchip{background:#F7EFD2;box-shadow:0 0 0 2px var(--gold);}
.bnode.hit .rstripes{opacity:.14;}
.bnode.miss{opacity:.30;filter:grayscale(1);}
.bnode.pending .rchip{border-style:dashed;}
.bnode.cruce .rchip{box-shadow:0 0 0 2.5px var(--neon),0 0 12px rgba(46,232,60,.7);background:#E9F9E4;}
.bnode.cruce .rstripes{opacity:.12;}
.bnode.champ .rchip{border:3px solid var(--gold);background:radial-gradient(circle at 34% 30%,#FBEFC0,#E8B83A 58%,#C8961C);box-shadow:0 0 0 3px var(--ink),0 0 22px rgba(200,150,28,.55);}
.bnode.champ .riso{color:#3a2c05;}
.bnode.champ.miss{opacity:.42;}
.champ-star{position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:15px;z-index:2;}
.champ-q{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--yellow);font-family:var(--ff-d);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:3;}
.bk-stats{display:flex;gap:0;border-top:2px solid var(--ink);flex-shrink:0;background:var(--paper-dark);}
.bk-stat{flex:1;text-align:center;padding:7px 2px;border-right:1px solid rgba(20,18,16,.16);}
.bk-stat:last-child{border-right:none;}
.bk-stat b{font-family:var(--ff-d);font-weight:700;font-size:16px;display:block;line-height:1;}
.bk-stat.pend b{color:var(--ink-soft);}
.bk-stat small{font-family:var(--ff-m);font-size:8px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;display:block;margin-top:3px;}
#bstage-official{position:absolute;inset:0;width:600px;height:600px;display:none;pointer-events:none;}
.bstage.under{opacity:.16;filter:grayscale(.6) brightness(.7);transition:opacity .25s,filter .25s;}
#bstage-official .bnode .rchip{box-shadow:none;}
#bstage-official .bnode.alive .rchip{background:var(--paper-dark);}
#bstage-official .bnode.elim{opacity:.30;filter:grayscale(1);}
#bstage-official .bnode.ph .rchip{background:var(--paper);border-style:dashed;}
#bstage-official .blines line.off{stroke:var(--ink-soft);opacity:.5;}
#bstage-official .blines line.offdim{stroke:var(--ink-soft);opacity:.14;}
</style>
</head>

function fmtStamp(iso){ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?String(iso):d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }

function crest(iso,cls=""){
  const ph = !iso;
  return `<span class="crest ${ph?'ph':''} ${cls}"><span class="stripes"><div></div><div></div><div></div></span><span class="iso">${esc(ph?'—':iso)}</span></span>`;
}
function teamLink(es,inner){
  if(!es) return inner;
  const url='https://www.google.com/search?q='+encodeURIComponent('Selección de fútbol de '+es);
  return `<a class="tlink" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${inner}</a>`;
}
function parseScore(s){ if(!s||typeof s!=="string"||!s.includes("-")) return null; const [a,b]=s.split("-").map(n=>parseInt(n,10)); return (isNaN(a)||isNaN(b))?null:[a,b]; }
function sign(h,a){ return h>a?'home':h<a?'away':'draw'; }
function pickStatus(pick,m){
  if(m.status!=="finalizado"||m.home_score==null||m.away_score==null) return null;
  const p=parseScore(pick); if(!p) return null;
  if(p[0]===m.home_score&&p[1]===m.away_score) return 'exacto';
  if(sign(p[0],p[1])===sign(m.home_score,m.away_score)) return 'signo';
  return 'fallo';
}
const STAT_IC = {exacto:'✅',signo:'🟨',fallo:'❌'};

/* ¿Está el partido en juego AHORA? El web_data NO se refresca durante el partido
   (el cron solo lo regenera ~18 min antes del saque y ~al final), así que la
   lucecita "EN JUEGO" la deduce el reloj del navegador desde la hora de saque.
   Madrid = UTC+2 todo el Mundial (CEST, jun–jul). Ventana 2h15 (90' + descanso +
   añadido). El estado del server manda: si ya es "finalizado" no hay lucecita;
   si el server ya dice "en juego", se respeta sin mirar el reloj. */
const LIVE_WINDOW_MS = 135*60*1000;       // grupos: 90' + descanso + añadido
const LIVE_WINDOW_KO_MS = 200*60*1000;    // KO: + prórroga + tanda de penaltis
function koInstant(m){
  const t=((m&&m.kickoff_madrid)||'').split(' ').pop();
  if(!m||!m.date||!/^\d{1,2}:\d{2}$/.test(t)) return null;
  const d=new Date(`${m.date}T${t.padStart(5,'0')}:00+02:00`);
  return isNaN(d)?null:d.getTime();
}
function matchIsLive(m){
  if(!m||m.status==="finalizado") return false;
  if(m.status==="en juego") return true;
  if(m.status!=="programado") return false;   // aplazado/suspendido/cancelado: nunca "en juego"
  const ko=koInstant(m); if(ko==null) return false;
  const win=(m.stage && m.stage!=="GROUP_STAGE") ? LIVE_WINDOW_KO_MS : LIVE_WINDOW_MS;
  const now=Date.now();
  return now>=ko && now<ko+win;
}
/* Etiqueta del desenlace de una eliminatoria: "pen. X-Y" o "pró." (prórroga).
   Vacío en fase de grupos (duration REGULAR) o si el partido no ha terminado. */
function koTag(m){
  if(!m||m.home_score==null) return '';
  if(m.duration==='PENALTY_SHOOTOUT' && m.home_penalties!=null && m.away_penalties!=null)
    return `pen. ${m.home_penalties}-${m.away_penalties}`;
  if(m.duration==='EXTRA_TIME') return 'pró.';
  return '';
}
function liveMatch(){ return (DATA.matches||[]).find(matchIsLive)||null; }

  // La cabecera abre la ficha del partido (predicciones de la porra).

  if(nbMatchId!=null){ nb.dataset.match=nbMatchId; nb.style.cursor='pointer'; } else { delete nb.dataset.match; nb.style.cursor=''; }

function matchRow(m){
  const fin=m.status==="finalizado", live=matchIsLive(m);

function renderElim(){
  const br=DATA.bracket||[];
  const el=$('#screen-elim');
  if(!br.length){ el.innerHTML=`<div class="sec-head"><h2>Eliminatorias</h2></div><div class="empty">El cuadro se rellenará al acabar la fase de grupos</div>`; return; }
  const order=["LAST_32","LAST_16","QUARTER","SEMI","FINAL","THIRD"];
  const sorted=br.slice().sort((a,b)=>order.indexOf(a.round)-order.indexOf(b.round));
  el.innerHTML = `<div class="sec-head"><h2>Eliminatorias</h2><div class="meta">Cuadro final<br>${sorted.length} rondas</div></div>
    <div class="bracket-outer" id="brkOuter">
      <div class="bracket-wrap" id="brkWrap"><div class="bracket">
      ${sorted.map(rd=>`<div class="bround">
        <div class="bround__h">${esc(ROUND_NAMES[rd.round]||rd.round)}</div>
        ${(rd.matches||[]).map(mt=>bMatch(mt,rd.round)).join('')}
      </div>`).join('')}
      </div></div>
    </div>
    <div class="brk-track" id="brkTrack"><div class="brk-thumb" id="brkThumb"></div></div>
    <div class="brk-hint">Desliza para ver todo el cuadro <span class="ar">→</span></div>`;
  initBracketScroll();
}
function initBracketScroll(){
  const wrap=$('#brkWrap'), thumb=$('#brkThumb'), outer=$('#brkOuter');
  if(!wrap||!thumb) return;
  const sync=()=>{
    const max=wrap.scrollWidth-wrap.clientWidth;
    const ratio=wrap.clientWidth/wrap.scrollWidth;
    const w=Math.max(0.14,Math.min(1,ratio));
    thumb.style.width=(w*100)+'%';
    const left=max>0?(wrap.scrollLeft/max)*(100-w*100):0;
    thumb.style.left=left+'%';
    if(outer){ outer.classList.toggle('can-left',wrap.scrollLeft>4); outer.classList.toggle('can-right',wrap.scrollLeft<max-4); }
  };
  wrap.addEventListener('scroll',sync,{passive:true});
  // permitir arrastrar el thumb
  const track=$('#brkTrack'); let drag=false;
  const toScroll=clientX=>{
    const r=track.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
    wrap.scrollLeft=p*(wrap.scrollWidth-wrap.clientWidth);
  };
  const down=e=>{drag=true;toScroll((e.touches?e.touches[0]:e).clientX);e.preventDefault();};
  const move=e=>{if(drag)toScroll((e.touches?e.touches[0]:e).clientX);};
  const up=()=>{drag=false;};
  track.addEventListener('mousedown',down); track.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
  requestAnimationFrame(sync);
}
function bMatch(mt,round){
  const resolved = mt.match_id!=null;
  const linked = resolved ? (DATA.matches||[]).find(m=>m.id===mt.match_id) : null;
  const fin = linked && linked.status==="finalizado" && linked.home_score!=null;
  let hWin=false,aWin=false,note='';
  if(fin){
    hWin=linked.home_score>linked.away_score; aWin=linked.away_score>linked.home_score;
    if(!hWin && !aWin && linked.duration==='PENALTY_SHOOTOUT'
       && linked.home_penalties!=null && linked.away_penalties!=null){
      // Empate en el campo: el ganador lo decide la tanda de penaltis.
      hWin=linked.home_penalties>linked.away_penalties;
      aWin=linked.away_penalties>linked.home_penalties;
      note=`pen. ${linked.home_penalties}-${linked.away_penalties}`;
    } else if(linked.duration==='EXTRA_TIME'){
      note='tras prórroga';
    }
  }
  const team=(es,iso,seed,sc,win,cnt)=> es ? `
    <div class="bteam ${win?'win':''}">${crest(iso)}<span class="nm">${esc(es)}</span>${cnt?`<span class="bx" title="${cnt} jugadores lo predijeron">×${cnt}</span>`:''}<span class="sc tnum">${sc??''}</span></div>`
    : `<div class="bteam seed"><span class="crest ph"><span class="iso">·</span></span><span class="nm">${esc(seed||'—')}</span><span class="sc"></span></div>`;
  const pc=mt.picks_count||{};
  return `<div class="bmatch ${resolved?'resolved':''} ${round==='FINAL'?'bfinal':''}" ${resolved?`data-match="${mt.match_id}"`:''}>
    ${team(mt.home_es,mt.home_iso,mt.home_seed,fin?linked.home_score:null,hWin,pc.home)}
    ${team(mt.away_es,mt.away_iso,mt.away_seed,fin?linked.away_score:null,aWin,pc.away)}
    ${note?`<div class="bpen" style="text-align:center;font-size:9px;color:var(--ink-soft);margin-top:1px">${note}</div>`:''}
  </div>`;
}

function openH2H(preA){
  const lb=(DATA.leaderboard||[]);
  if(lb.length<2) return;
  const a0=preA||lb[0].name;
  const b0=lb.find(p=>p.name!==a0).name;
  const opts=sel=>lb.map(p=>`<option value="${esc(p.name)}" ${p.name===sel?'selected':''}>${esc(p.name)}</option>`).join('');
  openSheet(`
    <div class="pf-head" style="margin-bottom:8px"><div class="pf-head__name" style="font-size:22px">⚔ Cara a cara</div></div>
    <div class="h2h-sel">

      <select id="h2b">${opts(b0)}</select>
    </div>
    <div id="h2h-body"></div>
  `);
  const draw=()=>{
    const A=leagueOf($('#h2a').value), B=leagueOf($('#h2b').value);
    if(!A||!B) return;
    const cats=Array.from(new Set([...Object.keys(A.cats||{}),...Object.keys(B.cats||{})]));
    const row=(lab,va,vb)=>{
      const aw=(+va||0)>(+vb||0), bw=(+vb||0)>(+va||0);
      return `<div class="h2h-grid">
        <div class="h2h-v ${aw?'win':''} tnum">${va}</div>
        <div class="h2h-cat">${esc(lab)}</div>
        <div class="h2h-v ${bw?'win':''} tnum">${vb}</div>
      </div>`;
    };
    $('#h2h-body').innerHTML = `
      <div class="h2h-grid" style="margin-bottom:8px">
        <div class="h2h-name">${esc(A.name)}</div><div></div><div class="h2h-name">${esc(B.name)}</div>
      </div>
      ${row('Pos',A.position,B.position)}
      ${row('Puntos',A.points,B.points)}
      ${cats.map(c=>row(c,(A.cats||{})[c]??0,(B.cats||{})[c]??0)).join('')}
      ${row('Exactos',A.exactos??0,B.exactos??0)}
      ${row('Signos',A.signos??0,B.signos??0)}
      ${row('Países que pasan',(A.ko_aciertos||{}).total_n??0,(B.ko_aciertos||{}).total_n??0)}
    `;
  };
  $('#h2a').addEventListener('change',draw);
  $('#h2b').addEventListener('change',draw);
  draw();
}

  }catch(err){ DATA=SAMPLE; }
  if(!DATA||!DATA.leaderboard) DATA=SAMPLE;
  renderAll();
}
/* ====================================================================
   CUADRO FINAL RADIAL por jugador ("Ver mi cuadro"). Autocontenido (IIFE):
   no expone globals; lee DATA.player_brackets / actual_bracket / reached_by_round /
   ko_eliminated / bracket.
   Portado de design/design_handoff_cuadro_final/cuadro-final.html.
   ==================================================================== */
(function(){
  const $=(s,r=document)=>r.querySelector(s);
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const bracket=$('#bracket'), bbg=$('#bracket-bg'), fit=$('#bfit'), zoom=$('#bzoom');
  if(!bracket) return;

  const RINGS=[
   {key:'R32',r:266,size:32},{key:'R16',r:210,size:36},{key:'QF',r:154,size:40},
   {key:'SF',r:102,size:44},{key:'F',r:56,size:46},{key:'CHAMP',r:0,size:64}
  ];
  const ROUND_KEYS=RINGS.map(r=>r.key);
  const ROUND_NAME={R32:'16avos',R16:'Octavos',QF:'Cuartos',SF:'Semis',F:'Final',CHAMP:'Campeón'};
  const SIZE={R32:32,R16:16,QF:8,SF:4,F:2,CHAMP:1};
  const STAGE_KEY={LAST_32:'R32',LAST_16:'R16',QUARTER:'QF',SEMI:'SF',FINAL:'F'};
  const C=300;
  function anglesByRound(){
    const pos={R32:Array.from({length:32},(_,i)=>-90+i*(360/32))};
    for(let ri=1;ri<RINGS.length;ri++){
      const key=RINGS[ri].key, prev=pos[RINGS[ri-1].key];
      if(key==='CHAMP'){pos[key]=[0];continue;}
      const a=[];for(let j=0;j<prev.length/2;j++)a.push((prev[2*j]+prev[2*j+1])/2);
      pos[key]=a;
    }
    return pos;
  }
  const ANG=anglesByRound();
  function xy(r,deg){const t=deg*Math.PI/180;return[C+r*Math.cos(t),C+r*Math.sin(t)];}

  // --- realidad (apagado por equipo EN VIVO / aro verde / capa oficial), desde DATA ---
  let reached={}, eliminated=new Set(), actualMatchByRound={}, REAL_BRACKET={};
  function buildReal(){
    const D=DATA||{};
    const rb=D.reached_by_round||{};
    reached={}; Object.keys(rb).forEach(k=>reached[k]=new Set(rb[k]||[]));
    eliminated=new Set(D.ko_eliminated||[]);
    // Cuadro real YA en orden de árbol (mismo esqueleto que los jugadores), de Python.
    REAL_BRACKET=D.actual_bracket||{};
    // Cruces reales por ronda para el aro verde "cruce clavado" (conjunto → da igual el orden).
    actualMatchByRound={};
    (D.bracket||[]).forEach(r=>{
      const key=STAGE_KEY[r.round]; if(!key)return;
      const set=new Set();
      (r.matches||[]).forEach(m=>{ if(m.home_iso&&m.away_iso) set.add([m.home_iso,m.away_iso].sort().join('|')); });
      if(set.size) actualMatchByRound[key]=set;
    });
  }
  function isOut(iso){
    if(eliminated.has(iso)) return true;                 // perdió un partido KO
    const r32=reached.R32;                                // o no clasificó a 16avos
    return !!(r32 && r32.size && !r32.has(iso));
  }
  function teamState(iso,key){
    const r=reached[key];
    if(r && r.has(iso)) return 'hit';                     // ha llegado a esta ronda
    if(isOut(iso)) return 'miss';                         // eliminado/no clasificó → apagado en TODAS
    return 'pending';                                     // aún podría llegar
  }
  function cruceHit(key,pairIdx,br){
    const set=actualMatchByRound[key]; if(!set)return false;
    const arr=br[key]||[], a=arr[2*pairIdx], b=arr[2*pairIdx+1];
    if(!a||!b)return false;
    return set.has([a.iso,b.iso].sort().join('|'));
  }
  function chip(t,sz){
    const fs=Math.round(sz*0.34);
    if(!t||!t.iso) return `<span class="rchip"><span class="riso" style="font-size:${fs}px;color:var(--ink-soft)">—</span></span>`;
    return `<span class="rchip"><span class="rstripes"><i></i><i></i><i></i></span><span class="riso" style="font-size:${fs}px">${esc(t.iso)}</span></span>`;
  }

  function renderBracket(name){
    const br=((DATA&&DATA.player_brackets)||{})[name]||null;
    $('#bk-title').textContent=name||'—';
    $('#bk-kick').textContent='Su cuadro de la fase final';
    if(!br){
      $('#bk-sub').textContent='';
      $('#bstage').innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;font-family:var(--ff-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);line-height:1.7">${esc(name||'Este jugador')} aún no ha rellenado su fase final</div>`;
      $('#bk-stats').innerHTML='';
      return;
    }
    const champ=(br.CHAMP||[])[0];
    $('#bk-sub').innerHTML=champ?`Campeón previsto · <b style="color:var(--ink)">${esc(champ.es)}</b>`:'';
    const nodePos={}; RINGS.forEach(ring=>{nodePos[ring.key]=ANG[ring.key].map(deg=>xy(ring.r,deg));});
    let lines='';
    RINGS.slice(0,5).forEach(ring=>{lines+=`<circle class="guide" cx="${C}" cy="${C}" r="${ring.r}"></circle>`;});
    for(let ri=1;ri<RINGS.length;ri++){
      const parents=nodePos[RINGS[ri].key], children=nodePos[RINGS[ri-1].key], childKey=RINGS[ri-1].key, childTeams=br[childKey]||[];
      parents.forEach((p,j)=>{
        const cr=cruceHit(childKey,j,br);
        [2*j,2*j+1].forEach(ci=>{
          const c=children[ci]; if(!c)return;
          const t=childTeams[ci];
          const st=t?teamState(t.iso,childKey):'pending';
          const cls=cr?'cruce':(st==='hit'?'lit':st==='miss'?'dim':'');
          lines+=`<line x1="${c[0].toFixed(1)}" y1="${c[1].toFixed(1)}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" class="${cls}"></line>`;
        });
      });
    }
    let nodes='';
    RINGS.forEach(ring=>{
      const teams=br[ring.key]||[], pts=nodePos[ring.key];
      pts.forEach((pt,i)=>{
        const t=teams[i]||null, x=pt[0], y=pt[1];
        const st=t?teamState(t.iso,ring.key):'pending';
        const isChamp=ring.key==='CHAMP';
        const isCruce=!isChamp && t && cruceHit(ring.key,Math.floor(i/2),br);
        let extra='';
        if(isChamp){extra+=`<span class="champ-star">★</span>`; if(st==='pending')extra+=`<span class="champ-q">?</span>`;}
        nodes+=`<div class="bnode ${st} ${isCruce?'cruce':''} ${isChamp?'champ':''}" data-tx="${x.toFixed(1)}" data-ty="${y.toFixed(1)}" data-sz="${ring.size}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${ring.size}px;height:${ring.size}px" title="${esc(t?t.es:'—')} · ${ROUND_NAME[ring.key]}">${chip(t,ring.size)}${extra}</div>`;
      });
    });
    $('#bstage').innerHTML=`<svg class="blines" viewBox="0 0 600 600">${lines}</svg>`+nodes;
    $('#bk-stats').innerHTML=ROUND_KEYS.map(k=>{
      const teams=br[k]||[], tot=SIZE[k];
      if(!reached[k]) return `<div class="bk-stat pend"><b>—</b><small>${ROUND_NAME[k]}</small></div>`;
      const hits=teams.filter(t=>t&&reached[k].has(t.iso)).length;
      return `<div class="bk-stat"><b class="tnum">${hits}/${tot}</b><small>${ROUND_NAME[k]}</small></div>`;
    }).join('');
    startPhysics();
    resetZoom();
  }

  // --- entrada física (atracción a su sitio + repulsión, amortiguado) ---
  let physRAF=null;
  function startPhysics(){
    if(physRAF){cancelAnimationFrame(physRAF);physRAF=null;}
    const stage=$('#bstage');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const place=n=>{n.el.style.transform=`translate(-50%,-50%) translate(${(n.x-n.tx).toFixed(1)}px,${(n.y-n.ty).toFixed(1)}px)`;};
    const nodes=[...stage.querySelectorAll('.bnode')].map(el=>{
      const tx=+el.dataset.tx,ty=+el.dataset.ty,sz=+el.dataset.sz;
      const a=Math.random()*Math.PI*2,r=58+Math.random()*78;
      return {el,tx,ty,sz,
        x:reduced?tx:300+(tx-300)*0.06+Math.cos(a)*r,
        y:reduced?ty:300+(ty-300)*0.06+Math.sin(a)*r,
        vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3};
    });
    if(reduced){nodes.forEach(n=>n.el.style.transform='translate(-50%,-50%)');return;}
    stage.classList.add('settling');
    nodes.forEach(place);
    const K=0.085,DAMP=0.80; let frame=0;
    function step(){
      frame++; let energy=0;
      for(let i=0;i<nodes.length;i++){
        const n=nodes[i]; let fx=(n.tx-n.x)*K, fy=(n.ty-n.y)*K;
        for(let j=0;j<nodes.length;j++){ if(i===j)continue; const m=nodes[j];
          const dx=n.x-m.x,dy=n.y-m.y,d2=dx*dx+dy*dy,min=(n.sz+m.sz)*0.62;
          if(d2<min*min){const d=Math.sqrt(d2)||0.1,f=(min-d)/d*0.6;fx+=dx*f;fy+=dy*f;}
        }
        n.vx=(n.vx+fx)*DAMP; n.vy=(n.vy+fy)*DAMP; n.x+=n.vx; n.y+=n.vy;
        energy+=n.vx*n.vx+n.vy*n.vy;
      }
      nodes.forEach(place);
      if(frame>=120||energy<2){ nodes.forEach(n=>n.el.style.transform='translate(-50%,-50%)'); stage.classList.remove('settling'); physRAF=null; return; }
      physRAF=requestAnimationFrame(step);
    }
    physRAF=requestAnimationFrame(step);
  }

  // --- capa OFICIAL (bracket real superpuesto, aros sin color, sin animación) ---
  function renderOfficial(){
    const stage=$('#bstage-official');
    const nodePos={}; RINGS.forEach(ring=>{nodePos[ring.key]=ANG[ring.key].map(deg=>xy(ring.r,deg));});
    let lines='';
    RINGS.slice(0,5).forEach(ring=>{lines+=`<circle class="guide" cx="${C}" cy="${C}" r="${ring.r}"></circle>`;});
    for(let ri=1;ri<RINGS.length;ri++){
      const parents=nodePos[RINGS[ri].key], children=nodePos[RINGS[ri-1].key], childKey=RINGS[ri-1].key;
      const childTeams=REAL_BRACKET[childKey]||[];
      parents.forEach((p,j)=>{[2*j,2*j+1].forEach(ci=>{
        const c=children[ci]; if(!c)return;
        const ct=childTeams[ci];
        const cls=(ct&&!eliminated.has(ct.iso))?'off':'offdim';
        lines+=`<line x1="${c[0].toFixed(1)}" y1="${c[1].toFixed(1)}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" class="${cls}"></line>`;
      });});
    }
    let nodes='';
    RINGS.forEach(ring=>{
      const pts=nodePos[ring.key], teams=REAL_BRACKET[ring.key]||[];
      pts.forEach((pt,i)=>{
        const x=pt[0], y=pt[1], t=teams[i]||null;
        if(t&&t.iso){
          const cls=eliminated.has(t.iso)?'elim':'alive';
          nodes+=`<div class="bnode ${cls}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${ring.size}px;height:${ring.size}px" title="${esc(t.es||t.iso)}">${chip(t,ring.size)}</div>`;
        }else{
          nodes+=`<div class="bnode ph" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${ring.size}px;height:${ring.size}px"><span class="rchip"><span class="riso" style="font-size:${Math.round(ring.size*0.34)}px;color:var(--ink-soft)">?</span></span></div>`;
        }
      });
    });
    stage.innerHTML=`<svg class="blines" viewBox="0 0 600 600">${lines}</svg>`+nodes;
  }
  let officialOn=false;
  function setOfficial(on){
    officialOn=on;
    $('#bstage-official').style.display=on?'block':'none';
    $('#bstage').classList.toggle('under',on);
    $('#bk-toggle').setAttribute('aria-pressed',on?'true':'false');
  }

  // --- zoom / pan (solo gestos) ---
  let fitScale=1,userZoom=1,panX=0,panY=0;
  function computeFit(){const w=fit.clientWidth,h=fit.clientHeight;if(!w||!h)return;fitScale=Math.min(w,h)/600*0.98;clampPan();apply();}
  function apply(){const s=fitScale*userZoom,w=fit.clientWidth,h=fit.clientHeight;
    const bx=(w-600*s)/2,by=(h-600*s)/2; zoom.style.transform=`translate(${bx+panX}px,${by+panY}px) scale(${s})`;}
  function clampPan(){const s=fitScale*userZoom,w=fit.clientWidth,h=fit.clientHeight;
    const ox=Math.max(0,(600*s-w)/2+30),oy=Math.max(0,(600*s-h)/2+30);
    panX=Math.max(-ox,Math.min(ox,panX));panY=Math.max(-oy,Math.min(oy,panY));}
  function resetZoom(){userZoom=1;panX=0;panY=0;requestAnimationFrame(computeFit);}
  function setZoom(z){userZoom=Math.max(1,Math.min(4,z));clampPan();apply();}
  const pts=new Map();let lastDist=0;
  fit.addEventListener('pointerdown',e=>{fit.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});});
  fit.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){panX+=e.clientX-prev.x;panY+=e.clientY-prev.y;clampPan();apply();}
    else if(pts.size===2){
      const arr=[...pts.values()];const dist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
      if(lastDist)setZoom(userZoom*(dist/lastDist));lastDist=dist;
    }
  });
  function endPt(e){pts.delete(e.pointerId);if(pts.size<2)lastDist=0;}
  fit.addEventListener('pointerup',endPt);fit.addEventListener('pointercancel',endPt);
  fit.addEventListener('wheel',e=>{e.preventDefault();setZoom(userZoom*(e.deltaY<0?1.12:0.89));},{passive:false});
  fit.addEventListener('dblclick',()=>setZoom(userZoom>1.3?1:2.2));

  // --- selector + abrir / cerrar ---
  function populateSelector(current){
    const sel=$('#bk-player');
    const pbs=(DATA&&DATA.player_brackets)||{};
    const lb=(DATA&&DATA.leaderboard)||[];
    let names=lb.filter(r=>pbs[r.name]).map(r=>({name:r.name,pts:r.points}));
    if(!names.length) names=Object.keys(pbs).map(n=>({name:n,pts:null}));
    if(current && !names.some(n=>n.name===current)) names.unshift({name:current,pts:null});
    sel.innerHTML=names.map(n=>`<option value="${esc(n.name)}">${esc(n.name)}${n.pts!=null?' · '+n.pts+' pts':''}</option>`).join('');
    sel.value=current;
  }
  function openBracket(name){
    buildReal();
    populateSelector(name);
    renderBracket(name);
    renderOfficial();
    setOfficial(false);
    bracket.classList.add('open'); if(bbg) bbg.classList.add('open');
  }
  function closeBracket(){
    bracket.classList.remove('open'); if(bbg) bbg.classList.remove('open');
    if(physRAF){cancelAnimationFrame(physRAF);physRAF=null;}
  }
  $('#bk-toggle').onclick=()=>setOfficial(!officialOn);
  $('#bk-player').onchange=e=>renderBracket(e.target.value);
  bracket.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeBracket);
  if(bbg) bbg.onclick=closeBracket;
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && bracket.classList.contains('open')){ e.stopPropagation(); closeBracket(); } }, true);
  document.addEventListener('click',e=>{ const b=e.target.closest('[data-bracket]'); if(b){ e.preventDefault(); openBracket(b.getAttribute('data-bracket')); } });
  window.addEventListener('resize',()=>{ if(bracket.classList.contains('open')) computeFit(); });
})();

installPWA();
load();
setInterval(load,60000);
</script>
